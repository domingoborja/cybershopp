<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Shopp</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbfbfa;--ink:#141414;--mute:#6c6c68;--line:#e7e6e2;--soft:#f1f0ed;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,251,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:12px;font:500 26px/1 var(--serif);letter-spacing:.01em}
.brand img{height:36px;width:auto}
.search{flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;font:inherit;outline:0}
.search input:focus{border-color:var(--ink)}
.cartbtn{border:1px solid var(--ink);background:transparent;border-radius:99px;padding:7px 16px;font-size:14px}
.cartbtn:hover{background:var(--ink);color:#fff}
.hero{padding:88px 0 64px;display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:end}
.hero h1{font:500 clamp(44px,7vw,92px)/.98 var(--serif);margin:0;letter-spacing:-.01em}
.hero p{color:var(--mute);max-width:34ch;margin:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 28px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 16px;font-size:14px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 28px;padding-bottom:96px}
.card .ph{aspect-ratio:4/5;margin-bottom:14px;transition:transform .5s}
.card:hover .ph{transform:scale(1.015)}
.ph{display:grid;place-items:center;overflow:hidden;border-radius:2px}
.ph img{width:100%;height:100%;object-fit:cover}
.ph span{font:italic 400 64px var(--serif);color:rgba(20,20,20,.55)}
.card h3{font:500 22px/1.2 var(--serif);margin:0}
.card .m{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-top:2px}
.empty{grid-column:1/-1;color:var(--mute);padding:40px 0}
.crumb{padding:28px 0 8px;color:var(--mute);font-size:14px}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding:16px 0 56px}
.gal .ph{aspect-ratio:1/1}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.thumbs button{padding:0;border:1px solid transparent;background:none;border-radius:2px}
.thumbs button[aria-current=true]{border-color:var(--ink)}
.thumbs .ph{aspect-ratio:1/1}.thumbs .ph span{font-size:24px}
.pd h1{font:500 clamp(36px,5vw,56px)/1.05 var(--serif);margin:6px 0 8px}
.price{font:500 28px var(--serif)}
.pd p.d{color:var(--mute);max-width:46ch}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:99px;align-items:center}
.qty button{border:0;background:none;width:36px;height:36px;font-size:18px}
.qty span{min-width:24px;text-align:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:99px;padding:12px 28px;font-weight:500}
.btn:hover{background:#000;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn.o{background:transparent;color:var(--ink)}
.buy{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0}
.specs{border-top:1px solid var(--line);margin-top:28px}
.specs div{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.specs dt{color:var(--mute)}
.rev{padding:48px 0 96px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:56px}
.rev h2,.terms h1{font:500 36px/1.1 var(--serif);margin:0 0 20px}
.r{padding:16px 0;border-bottom:1px solid var(--line)}
.r b{font-weight:500}.r small{color:var(--mute)}.r p{margin:6px 0 0}
.stars{letter-spacing:2px}
form.rf{display:grid;gap:12px}
.rf input,.rf textarea,.rf select{border:1px solid var(--line);background:#fff;border-radius:2px;padding:10px 12px;font:inherit}
.terms{max-width:720px;padding:56px 24px 96px}
.terms h2{font:500 24px var(--serif);margin:32px 0 6px}.terms p{color:var(--mute);margin:0}
footer{border-top:1px solid var(--line);padding:40px 0 48px;font-size:14px;color:var(--mute)}
.fg{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.fg nav{display:flex;gap:20px;flex-wrap:wrap}
.fg a:hover{color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(20,20,20,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px))}
aside.on{transform:none}
aside h2{font:500 28px var(--serif);margin:0 0 12px;display:flex;justify-content:space-between}
aside h2 button{border:0;background:none;font-size:24px}
.items{flex:1;overflow:auto}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.it .ph{aspect-ratio:1/1}.it .ph span{font-size:22px}
.it small{color:var(--mute)}
.it .rm{border:0;background:none;color:var(--mute);font-size:13px;text-decoration:underline;padding:0}
.tot{display:flex;justify-content:space-between;font:500 24px var(--serif);padding:16px 0}
.note{font-size:13px;color:var(--mute);margin:10px 0 0;min-height:20px}
@media(max-width:760px){.hero,.pd,.rev{grid-template-columns:1fr;gap:28px}.hero{padding:48px 0 36px}.brand span{display:none}.bar{gap:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{text-transform:uppercase}
h1,h2,h3,.chip,.btn,.cartbtn,.crumb{letter-spacing:.08em}
.hero h1{font-size:clamp(34px,5.4vw,70px);line-height:1.1}
.card h3{font-size:19px}
.brand span,.fg b{font-style:italic;text-transform:uppercase;letter-spacing:.14em;font-size:19px}
body.prod main{text-transform:none}
body.prod main *{letter-spacing:normal}
.terms p,.chat,.ann p,.mq{text-transform:none;letter-spacing:0}
.mq{background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;font-size:13px}
.mq #mqi{display:inline-flex;animation:mq 45s linear infinite;padding:7px 0}
.mq:hover #mqi{animation-play-state:paused}
.mq .g{display:flex;flex-shrink:0}
.mq span{display:flex;align-items:center;padding:0 22px}
.mq span::after{content:"";width:4px;height:4px;border-radius:50%;background:#fff;opacity:.5;margin-left:44px}
@keyframes mq{to{transform:translateX(-50%)}}
.wa{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;border:0;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:25}
.wa svg{width:31px;height:31px;fill:#fff}
.chat{position:fixed;right:20px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 40px));height:min(500px,calc(100% - 170px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.22);z-index:26;display:none;flex-direction:column;overflow:hidden;font-size:14px}
.chat.on{display:flex}
.ch{background:#128c7e;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.ch small{display:block;opacity:.85}.ch button{border:0;background:none;color:#fff;font-size:24px}
.cm{flex:1;overflow:auto;padding:14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:8px 12px;border-radius:12px;background:#fff;white-space:pre-wrap}
.b.u{align-self:flex-end;background:#d9fdd3}
.cq{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.cq button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:13px}
.cq button.hu{border-color:#128c7e;color:#128c7e}
.cf{display:flex;gap:8px;padding:10px 12px}
.cf input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font:inherit}
.sm{padding:6px 14px;font-size:13px}
.ann{position:fixed;left:50%;top:50%;width:min(440px,calc(100% - 40px));max-height:80%;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:30px 28px;z-index:40;transform:translate(-50%,-50%);transition:all .55s cubic-bezier(.6,0,.3,1);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.ann.min{left:44px;top:calc(100% - 44px - env(safe-area-inset-bottom,0px));transform:translate(-50%,-50%) scale(.05);opacity:0;pointer-events:none}
.ann h2{font:italic 500 30px var(--serif);margin:0 0 8px;text-transform:uppercase;letter-spacing:.1em}
.ann h3{font:500 20px var(--serif);margin:0 0 4px;letter-spacing:.08em}
.ai{padding:16px 0;border-top:1px solid var(--line)}.ai p{margin:0 0 12px;color:var(--mute)}
.ax{position:absolute;top:10px;right:14px;border:0;background:none;font-size:26px}
.annb{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;background:var(--ink);border:0;display:none;place-items:center;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.annb.on{display:grid;animation:pop .4s .4s both}
.annb i{position:absolute;top:-2px;right:-2px;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:99px;font:500 11px/16px var(--sans);min-width:18px;text-align:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.rt{font:500 18px var(--serif);margin:28px 0 4px}
.rl{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rl .ph span{font-size:20px}.rl small{color:var(--mute)}
.promo{display:flex;gap:10px;align-items:center;border:1px dashed var(--ink);padding:9px 12px;margin-top:10px}
.promo input{flex:1;min-width:0;border:0;background:transparent;font:500 15px var(--sans);letter-spacing:.18em;text-transform:uppercase;outline:0}
.promo span{font-size:13px;color:var(--mute)}.promo span.ok{color:#1c7a45}
.sv{display:flex;justify-content:space-between;font-size:13px;color:#1c7a45;padding-top:8px}
.tot s{font-size:16px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.mq #mqi,.annb.on{animation:none}}

.nv{display:flex;gap:26px;margin-left:12px;font-size:14px;letter-spacing:.1em}
.nv a{padding:4px 0;border-bottom:1px solid transparent}.nv a:hover{border-color:var(--ink)}
.pw{position:relative}
.tg{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;font:500 11px/1 var(--sans);font-style:normal;padding:6px 9px;letter-spacing:.1em}
.m s,.price s{color:var(--mute);font-weight:400;margin-right:6px}
.tb{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.tb select{border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;font-size:14px;padding:6px 2px;color:var(--mute)}
.zn{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding-top:12px}
.zn select{border:1px solid var(--line);background:#fff;padding:6px;font:inherit;max-width:200px}
.ze{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;padding-top:6px}
.help details{border-bottom:1px solid var(--line);padding:14px 0}.help summary{cursor:pointer;font:500 20px var(--serif);letter-spacing:.06em}
.help details p{margin-top:8px}
.help table{width:100%;border-collapse:collapse;font-size:14px;text-transform:none}.help td{padding:10px 0;border-bottom:1px solid var(--line);color:var(--mute)}.help td:first-child{color:var(--ink)}


.co{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;padding:48px 24px 96px}
.co h1{font:500 40px/1.1 var(--serif);margin:0 0 24px}.co h2{font:500 24px var(--serif);margin:32px 0 12px}
.fg2{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.co label{display:block;font-size:12px;letter-spacing:.1em;color:var(--mute)}
.co input:not([type=checkbox]),.co select,.co textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:#fff;padding:11px 12px;font:400 15px var(--sans);border-radius:2px;color:var(--ink)}
.co input:invalid:not(:placeholder-shown){border-color:#b3261e}
.co label.full{margin-bottom:16px}
.co .ck{display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:10px 0}.ck input{margin-top:4px}.ck a{text-decoration:underline}
.bc{border:1px dashed var(--line);padding:14px 16px;margin-bottom:20px}
.bc .btn{display:inline-block;margin-top:6px}
.sum{position:sticky;top:120px;align-self:start;border:1px solid var(--line);padding:24px;background:#fff}
.sum h2{margin-top:0}.sum .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.sum .gt{font:500 26px var(--serif);border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
#mp{width:100%;margin-top:14px}
@media(max-width:760px){.co{grid-template-columns:1fr;gap:32px;padding-top:28px}.fg2{grid-template-columns:1fr}.sum{position:static}}

/* animaciones */
.ph{position:relative}.ph span{position:relative;z-index:1}
.ph::after{content:"";position:absolute;inset:-25%;pointer-events:none;translate:0 var(--py,0px);background:radial-gradient(circle at calc(50% + var(--sx,0)*35%) calc(30% + var(--sy,0)*35%),rgba(255,255,255,.55),transparent 55%)}
.ph>img{translate:0 var(--py,0px);transform:scale(1.15);transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1) calc(var(--d,0)*90ms),transform .8s cubic-bezier(.2,.7,.2,1) calc(var(--d,0)*90ms)}
.rv.in{opacity:1;transform:none}
.card .ph{clip-path:inset(0 0 0 0);transform:perspective(700px) rotateX(calc(var(--my,0)*-6deg)) rotateY(calc(var(--mx,0)*6deg)) scale(var(--sc,1));transition:transform .45s cubic-bezier(.2,.7,.2,1),clip-path 1.1s cubic-bezier(.7,0,.2,1) calc(var(--d,0)*90ms)}
.card.rv:not(.in) .ph{clip-path:inset(0 0 100% 0)}
.card.rv:not(.in) .ph>img{transform:scale(1.45)}
.card:hover{--sc:1.035}.card:hover .ph>img{transform:scale(1.22)}
.card h3,.card .m{transition:transform .4s}.card:hover h3{transform:translateX(6px)}
.w{display:inline-block}
.pg .w{animation:wd .95s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*110ms + 150ms)}
.pg .hero p{animation:fu .9s .55s cubic-bezier(.2,.7,.2,1) both}.pg .tb{animation:fu .9s .75s cubic-bezier(.2,.7,.2,1) both}
.pg .pd,.pg .terms,.pg .co{animation:fu .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes wd{from{opacity:0;transform:translateY(55%) rotate(2deg)}}
@keyframes fu{from{opacity:0;transform:translateY(24px)}}
#main .ph{animation:sw .6s cubic-bezier(.2,.7,.2,1)}
@keyframes sw{from{opacity:.2;transform:scale(1.04)}}
.bump{animation:bm .5s}@keyframes bm{35%{transform:scale(1.14)}}
.wa::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.wa{transition:transform .3s}.wa:hover{transform:scale(1.08) rotate(-6deg)}
.brand img{transition:transform .5s}.brand:hover img{transform:rotate(-10deg) scale(1.08)}
header{transition:box-shadow .3s}header.sc{box-shadow:0 6px 24px rgba(0,0,0,.06)}
.btn{transition:transform .2s,box-shadow .2s,background .2s}.btn:active{transform:scale(.97)}
.chip{transition:background .25s,color .25s}
@media(prefers-reduced-motion:reduce){.rv,.card .ph,.ph>img{opacity:1!important;transform:none!important;clip-path:none!important;translate:none!important}.pg *,.wa::before,#main .ph,.bump{animation:none!important}}
@media(max-width:760px){.bar{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:8px;gap:10px 14px}.brand{order:1}.search{order:2}.cartbtn{order:3}.nv{display:flex!important;order:4;width:100%;margin:0;gap:22px;overflow-x:auto;white-space:nowrap;font-size:13px}}

[hidden]{display:none!important}
.aov{position:fixed;inset:0;z-index:39;background:rgba(20,20,20,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .45s}
.aov.on{opacity:1;pointer-events:auto}
body.noscroll{overflow:hidden}
.co .pm{margin:8px 0}

.wrap>.co{padding:24px 0 96px}
.co input:not([type=checkbox]):not([type=radio]),.co select,.co textarea{display:block}
.co input[type=radio]{width:auto;display:inline-block;margin:3px 0 0;padding:0}
.stp{display:flex;max-width:640px;margin:0 auto;padding:36px 0 8px;list-style:none}
.stp li{flex:1;position:relative;text-align:center;font-size:14px;color:var(--mute)}
.stp li::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line);transition:background .5s}
.stp li:first-child::before{display:none}
.stp li.on::before,.stp li.done::before{background:var(--ink)}
.stp .c{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid var(--line);font-weight:500}
.stp li.on,.stp li.done{color:var(--ink)}.stp li.on .c{background:var(--ink);border-color:var(--ink);color:#fff}.stp li.done .c{border-color:var(--ink)}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.co label.tc{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:#fff;padding:16px;cursor:pointer;color:var(--ink);letter-spacing:0;transition:border-color .2s,box-shadow .2s}
.tc:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.tc.off{opacity:.5;cursor:not-allowed}.tc b{display:block;font:500 18px var(--serif);letter-spacing:.06em}.tc small{display:block;color:var(--mute);font-size:13px;text-transform:none}
.p51{display:flex;margin-top:6px;border:1px solid var(--line);background:#fff}.p51 span{padding:11px 12px;border-right:1px solid var(--line);color:var(--mute);font:400 15px var(--sans)}.co .p51 input{border:0;margin:0}
.pys{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.pay{display:block;text-align:left;border:1px solid var(--ink);padding:18px 20px;border-radius:2px;background:transparent;transition:transform .2s,box-shadow .2s}
.pay b{display:block;font:500 20px var(--serif);letter-spacing:.06em}.pay small{display:block;opacity:.75;font-size:13px;margin-top:2px;text-transform:none;letter-spacing:0}
.pay.mp{background:var(--ink);color:#fff}.pay:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.15)}.pay:disabled{opacity:.5}
@media(max-width:760px){.tp,.pys{grid-template-columns:1fr}}

/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {

function cartPage(){
  const T=tot();if(!T.ids.length)return empty();track('carrito_ver');
  const cats=new Set(T.ids.map(i=>P.find(p=>p.id==i).cat)),rel=P.filter(p=>!cart[p.id]).sort((a,b)=>cats.has(b.cat)-cats.has(a.cat)).slice(0,3);
  $('#app').innerHTML=`<div class="wrap">${stepper(1)}<div class="co"><div><h1>Tu carrito</h1>${T.ids.map(i=>{const p=P.find(x=>x.id==i);return `<div class="it">${ph(p)}<div><b style="font-weight:500">${p.name}</b><br><small>${fm(p.price)}</small><br><button class="rm" data-rm="${i}">Quitar</button></div><div class="qty"><button data-d="-1" data-i="${i}" aria-label="Menos">−</button><span>${cart[i]}</span><button data-d="1" data-i="${i}" aria-label="Más">+</button></div></div>`}).join('')}
  ${rel.length?`<h3 class="rt">También te puede gustar</h3>${rel.map(p=>`<div class="rl">${ph(p)}<div><b style="font-weight:500">${p.name}</b><br><small>${fm(p.price)}</small></div><button class="btn o sm" data-ra="${p.id}">Añadir</button></div>`).join('')}`:''}</div>
  ${sumHTML(T,CONT)}</div></div>`;
  document.querySelectorAll('#app [data-rm]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.rm];save();cartPage()});
  document.querySelectorAll('#app [data-d]').forEach(b=>b.onclick=()=>{const i=b.dataset.i;cart[i]+=+b.dataset.d;if(cart[i]<1)delete cart[i];save();cartPage()});
  document.querySelectorAll('#app [data-ra]').forEach(b=>b.onclick=()=>{cart[b.dataset.ra]=1;track('agregar_relacionado',b.dataset.ra);save();cartPage()});
  if(!promo.done){clearInterval(promo.iv);setTimeout(typeSum,600)}
}
