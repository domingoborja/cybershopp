<style>
:root{color-scheme:light;--bg:#fbfbfa;--ink:#141414;--mute:#6c6c68;--line:#e7e6e2;--soft:#f1f0ed;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,251,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:12px;font:500 26px/1 var(--serif);letter-spacing:.01em}
.brand img{height:36px;width:auto}
.search{flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;font:inherit;outline:0}
.search input:focus{border-color:var(--ink)}
.cartbtn{border:1px solid var(--ink);background:transparent;border-radius:99px;padding:7px 16px;font-size:14px}

.bt{position:relative;max-width:560px}
.bk{display:inline-block;font-size:12px;letter-spacing:.2em;border:1px solid currentColor;padding:5px 12px;margin-bottom:18px}
.bs h2{font:500 clamp(32px,5.4vw,74px)/1.04 var(--serif);margin:0 0 14px;letter-spacing:.04em}
.bs p{margin:0 0 24px;max-width:38ch;text-transform:none;font-size:clamp(14px,1.6vw,18px);opacity:.85}
.pg .bs.on .bt,.bs.on.fx .bt{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
.ba{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--ink);font-size:24px;line-height:1;z-index:2}
.ba.prev{left:16px}.ba.next{right:16px}.ba:hover{background:#fff}
.bd{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px;z-index:2}
.bdot{width:28px;height:4px;border:0;background:rgba(120,120,120,.5);padding:0;border-radius:2px}.bdot[aria-current]{background:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.hero{padding:56px 0 40px}
.bc.payd{margin:16px 0}.pdat{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0}
.pdat small{display:block;color:var(--mute);font-size:12px;letter-spacing:.1em}.pdat b{font:500 20px var(--serif);letter-spacing:.04em}
.up{display:block;margin:10px 0;font-size:12px;letter-spacing:.1em;color:var(--mute)}
.co label.up input[type=file]{margin-top:8px;padding:12px;border:1px dashed var(--ink);font-size:14px}
.vth{display:block;max-width:180px;max-height:220px;border:1px solid var(--line);border-radius:6px;margin:8px 0}
.qr{display:block;width:180px;max-width:100%;margin:10px 0;border-radius:6px}
#fin{width:100%;margin-top:6px}
.spk{animation-duration:1.6s!important}
.bump{animation-duration:1.15s!important}
@media(max-width:760px){.ft{grid-template-columns:1fr 1fr;gap:28px}.fb{grid-column:1/-1}.ba{display:none}.hero{padding:36px 0 28px}}

.lr{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brown);color:var(--brown-d);padding:8px 14px;border-radius:4px;transition:background .2s,color .2s}
.lr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.lr:hover{background:var(--brown);color:#fff}
.tp3{grid-template-columns:repeat(3,1fr)}
.qr{width:220px;max-width:100%;background:#fff;padding:10px;border:1px solid var(--line);border-radius:12px;margin:6px 0}
.qrw{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pdat .btn{margin-top:6px}
.hoja{border:1px solid var(--ink);padding:22px;background:#fff;margin:20px 0;font-size:14px;line-height:1.7;text-transform:none}
.hoja b{font-weight:500}
@media print{header,footer,.wa,.annb,.chat,.ann,.aov,.sbar,.acts,.mq{display:none!important}}
@media(max-width:760px){.tp3{grid-template-columns:1fr}}

/* v12 */
:root{--brown:#bd9667;--brown-d:#8a6540}
.ft{grid-template-columns:1.3fr 1fr 1fr 1.4fr}
.fh{margin:0 0 12px;color:var(--mute)}
.cf2{display:grid;gap:8px}
.cf2 input,.cf2 textarea{width:100%;border:1px solid #dccfbb;background:#fff;border-radius:6px;padding:10px 12px;font:400 14px var(--sans);color:var(--ink)}
.cf2 input:focus,.cf2 textarea:focus{outline:0;border-color:var(--brown);box-shadow:0 0 0 3px rgba(189,150,103,.25)}
.cf2 small{font-size:11px;color:var(--mute);text-transform:none;letter-spacing:0}.cf2 small a{text-decoration:underline}
.cf2 .btn{justify-self:start;background:var(--brown-d);border-color:var(--brown-d);color:#fff}
.tp3{grid-template-columns:1fr!important}.tp3 .tc{min-height:76px}
.ck>span{flex:1;min-width:0;line-height:1.5}
.nms{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.nm{font:400 20px 'Special Elite','Courier New',Courier,monospace;letter-spacing:.08em;text-transform:none;background:#fff;border:1px solid var(--ink);border-bottom:3px solid var(--ink);padding:6px 12px;border-radius:3px;line-height:1.2;color:var(--ink)}
@media(max-width:760px){.fc{grid-column:1/-1}}

/* v13 */
:root{--brown:#ab9c88;--brown-d:#7d7060}
.wbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--brown);color:var(--brown-d);padding:10px 20px;border-radius:99px;font-size:14px;letter-spacing:.14em;transition:background .25s,color .25s,transform .25s}
.wbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wbtn:hover{background:var(--brown);color:#fff;transform:translateY(-2px)}
.qk{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.qk button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;text-transform:none;letter-spacing:0}.qk button:hover{border-color:var(--ink)}

/* v14 */
:root{--brown:#c7bcaa;--brown-d:#7d7060}
.soc a:hover{color:var(--brown-d)}
.wbtn{display:none}
@media(max-width:760px){.ft{grid-template-columns:1fr 1fr!important;gap:28px 20px}.fb,.fc{grid-column:1/-1}.fl a{overflow-wrap:anywhere}}

const save=()=>{store.set('cs_cart',cart);{const c=Object.values(cart).reduce((a,b)=>a+b,0),b=$('#cb');if(c>+$('#cc').textContent){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}$('#cc').textContent=c}renderCart()};
function renderCart(){
  const ids=Object.keys(cart).filter(i=>P.some(p=>p.id==i)),total=ids.reduce((a,i)=>a+cart[i]*P.find(p=>p.id==i).price,0);
  if(!ids.length){clearInterval(promo.iv);promo.t='';promo.done=false;promo.run=false}
  const disc=promo.done?total*PCT:0,fin=total-disc,cats=new Set(ids.map(i=>P.find(p=>p.id==i).cat));
  const rel=P.filter(p=>!cart[p.id]).sort((a,b)=>cats.has(b.cat)-cats.has(a.cat)).slice(0,3);
  $('#dr').innerHTML=`<h2>Tu carrito <button id="x" aria-label="Cerrar">×</button></h2><div class="items">${ids.map(i=>{const p=P.find(x=>x.id==i);return `<div class="it">${ph(p)}<div><b style="font-weight:500">${p.name}</b><br><small>${fm(p.price)} × ${cart[i]}</small><br><button class="rm" data-rm="${i}">Quitar</button></div><div class="qty"><button data-d="-1" data-i="${i}" aria-label="Menos">−</button><span>${cart[i]}</span><button data-d="1" data-i="${i}" aria-label="Más">+</button></div></div>`}).join('')||'<p class="empty">Tu carrito está vacío. Elige un producto para empezar.</p>'}
  ${rel.length?`<h3 class="rt">También te puede gustar</h3>${rel.map(p=>`<div class="rl">${ph(p)}<div><b style="font-weight:500">${p.name}</b><br><small>${fm(p.price)}</small></div><button class="btn o sm" data-ra="${p.id}">Añadir</button></div>`).join('')}`:''}</div>
  ${ids.length?`<div class="promo"><input id="pc" readonly value="${promo.t}" placeholder="Código promocional" aria-label="Código promocional"><span class="${promo.done?'ok':''}">${promo.done?'Aplicado':'Aplicando…'}</span></div>`:''}${promo.done?`<div class="sv"><span>Ahorras ${fm(disc)}</span><span>${CODE} −${CONFIG.promoPercent}%</span></div>`:''}
  <div class="tot"><span>Total</span><span>${promo.done?`<s>${fm(total)}</s> `:''}${fm(fin)}</span></div><button class="btn" id="pay" ${ids.length?'':'disabled'}>Continuar con la compra</button><p class="note" id="nt">Envío incluido en el precio.</p>`;
  $('#x').onclick=closeCart;
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.rm];save()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=b.dataset.i;cart[i]+=+b.dataset.d;if(cart[i]<1)delete cart[i];save()});
  document.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{cart[b.dataset.ra]=1;track('agregar_relacionado',b.dataset.ra);save()});
  $('#pay').onclick=()=>{closeCart();if(location.hash!='#/carrito')location.hash='#/carrito'};
  if(ids.length&&!promo.done&&!promo.run&&$('#dr').classList.contains('on'))setTimeout(typePromo,700);
}
function typePromo(){if(promo.run||promo.done)return;promo.run=true;promo.t='';promo.iv=setInterval(()=>{promo.t=CODE.slice(0,promo.t.length+1);const e=$('#pc');if(e)e.value=promo.t;if(promo.t==CODE){clearInterval(promo.iv);promo.done=true;promo.run=false;renderCart()}},170)}

const chatLog=[],greet='Hola, soy el asistente de Cyber Shopp. Te ayudo con productos, envíos y pagos. ¿Qué necesitas?';let busy=false;
const FAQ=[[/env[ií]o|entrega|demora|llega/,'Enviamos a todo el Perú y el costo de envío ya está incluido en el precio. El plazo depende de tu ubicación.'],[/pago|tarjeta|yape|mercado/,'Puedes pagar con Yape, Plin o transferencia (adjuntas tu evidencia), o contraentrega sin cargos adicionales.'],[/devol|cambio|garant/,'Aceptas cambios y devoluciones dentro de 7 días con el producto sin uso. Cada producto indica su garantía.'],[/descuento|cup[oó]n|promo|c[oó]digo/,'Al abrir tu carrito se aplica automáticamente un código de descuento.']];
function drawChat(){$('#cm').innerHTML=[{r:'b',t:greet},...chatLog].map(m=>`<div class="b ${m.r}">${esc(m.t)}</div>`).join('')+(busy?'<div class="b">Escribiendo…</div>':'');$('#cm').scrollTop=1e5}
function human(){track('chat_asesor');const last=chatLog.filter(m=>m.r=='u').slice(-3).map(m=>m.t).join(' / ');window.open(`https://wa.me/${CONFIG.whatsapp}?text=`+encodeURIComponent('Hola Cyber Shopp, te escribo desde la web.'+(last?' Mi consulta: '+last:'')),'_blank')}
async function ask(){
  const q=chatLog[chatLog.length-1].t;
  try{const s=window.claude&&await claude.use('sample');
    if(s){const ctx=P.map(p=>`- ${p.name} (${p.cat}), ${fm(p.price)}: ${p.short}`).join('\n'),h=chatLog.slice(-8).map(m=>(m.r=='u'?'Cliente: ':'Asistente: ')+m.t).join('\n');
      const r=await s(`Eres el asistente de la tienda online Cyber Shopp (Perú). Responde en español, con un máximo de 3 frases, tono amable y sofisticado. Catálogo:\n${ctx}\nEnvíos a todo el Perú; el costo de envío ya está incluido en los precios. Pagos con Yape, Plin, transferencia o contraentrega. Cambios y devoluciones dentro de 7 días. El carrito aplica automáticamente un código de descuento. No inventes datos que no estén aquí. Si el cliente quiere comprar con ayuda, hacer un reclamo o hablar con una persona, indícale que pulse el botón "Hablar con una persona".\n\nConversación:\n${h}\nAsistente:`,{cache:false,modelTier:'quick'});
      if(r&&r.text)return r.text.trim()}}catch(e){}
  const f=FAQ.find(x=>x[0].test(q.toLowerCase()));
  return f?f[1]:'Gracias por escribirnos. Para ayudarte mejor, pulsa "Hablar con una persona" y te atendemos por WhatsApp.'
}
async function send(txt){if(!txt.trim()||busy)return;chatLog.push({r:'u',t:txt.trim()});busy=true;drawChat();const a=await ask();busy=false;chatLog.push({r:'b',t:a});drawChat()}
$('#cq').innerHTML=['Envíos','Medios de pago','Devoluciones'].map(x=>`<button data-q="${x}">${x}</button>`).join('')+'<button class="hu">Hablar con una persona</button>';

/* ===== efectos de scroll y mouse ===== */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let io,par=[];
const io_cb=es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting));
function bindFx(){
  if(io)io.disconnect();io=new IntersectionObserver(io_cb,{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  const sel='#app .card,#app .gal,#app .pd>div:last-child,#app .rev>div,#app .terms h2,#app .r,#app .specs>div,#app .co form,#app .sum,#app .tb';
  let i=0,last=-1;document.querySelectorAll(sel).forEach(e=>{if(!e.classList.contains('rv')){e.classList.add('rv');e.style.setProperty('--d',e.matches('.card')?i%4:0)}i++;io.observe(e)});
  par=[...document.querySelectorAll('#app .card,#app .gal')];upd();
}
let tick=false;
function upd(){tick=false;const h=innerHeight;par.forEach(e=>{const r=e.getBoundingClientRect();e.style.setProperty('--py',RM?'0px':((r.top+r.height/2-h/2)/h*-26).toFixed(1)+'px')});$('header').classList.toggle('sc',scrollY>10)}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});addEventListener('resize',upd);
new MutationObserver(bindFx).observe($('#app'),{childList:true});
if(matchMedia('(hover:hover)').matches&&!RM){
  $('#app').addEventListener('mousemove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',((e.clientX-r.left)/r.width*2-1).toFixed(2));c.style.setProperty('--my',((e.clientY-r.top)/r.height*2-1).toFixed(2));c.style.setProperty('--sx',((e.clientX-r.left)/r.width*2-1).toFixed(2));c.style.setProperty('--sy',((e.clientY-r.top)/r.height*2-1).toFixed(2))});
  $('#app').addEventListener('mouseout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){['--mx','--my','--sx','--sy'].forEach(v=>c.style.removeProperty(v))}});
}
save();route();
